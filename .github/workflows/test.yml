name: Test

on:
  push:
  workflow_dispatch:

jobs:
  test-dotnet:
    name: Test .NET
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore dependencies
        run: dotnet restore
      - name: Test
        run: dotnet test --verbosity normal --logger "GitHubActions;summary-include-passed=false;summary-include-skipped=true"
      # Building the web project regenerates the TypeScript DTOs, so a difference means they were not committed
      - name: Check the generated TypeScript DTOs are up to date
        run: |
          git diff --exit-code -- AttunedWeb/front-end/src/dtos || {
            echo "::error::The generated DTOs (Dtos.ts) are out of date. Build AttunedWeb locally and commit the result."
            exit 1
          }
  test-front-end:
    name: Test front-end
    runs-on: ubuntu-latest
    env:
      working-directory: ./AttunedWeb/front-end
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26.x"
      - name: Install
        working-directory: ${{env.working-directory}}
        run: npm install
      - name: Lint
        working-directory: ${{env.working-directory}}
        run: npm run lint
      - name: Format check
        working-directory: ${{env.working-directory}}
        run: npm run format:check
      - name: Test
        working-directory: ${{env.working-directory}}
        run: npm test
